# .github/workflows/deploy.yml
name: Build and Push Docker Image to AWS ECR

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'VERSION.txt'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Get Commit Message
        id: get_commit
        run: echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Determine Commit Type
        id: commit_type
        run: |
          COMMIT_MESSAGE="${{ steps.get_commit.outputs.message }}"
          echo "Commit Message: $COMMIT_MESSAGE"

          if [[ "$COMMIT_MESSAGE" == feat:* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MESSAGE" == fix:* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MESSAGE" == BREAKING\ CHANGE:* ]] || [[ "$COMMIT_MESSAGE" == *"!:"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi
      - name: Update VERSION.txt
        if: steps.commit_type.outputs.type != 'none'
        run: |
          VERSION=$(cat VERSION.txt)
          echo "Current Version: $VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo $VERSION | sed 's/\.develop$//')"

          case "${{ steps.commit_type.outputs.type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            NEW_VERSION="${NEW_VERSION}.develop"
          fi

          echo "New Version: $NEW_VERSION"
          echo "$NEW_VERSION" > VERSION.txt

      - name: Commit and Push VERSION.txt
        if: steps.commit_type.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout ${{ github.ref_name }}
          git add VERSION.txt
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Set Version Variable
        run: |
          if [ -f VERSION.txt ]; then
            VERSION=$(cat VERSION.txt)
          else
            VERSION="latest"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Authenticate Docker to AWS ECR
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 365875330517.dkr.ecr.eu-west-1.amazonaws.com

      - name: Build Docker Image
        run: docker build -t tantar:$VERSION .

      - name: Tag Docker Image
        run: docker tag tantar:$VERSION 365875330517.dkr.ecr.eu-west-1.amazonaws.com/tantar:$VERSION

      - name: Push Docker Image to AWS ECR
        run: docker push 365875330517.dkr.ecr.eu-west-1.amazonaws.com/tantar:$VERSION

      - name: Set environment variable based on branch
        id: set-env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "SERVER_IP=tantar.ai" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "SERVER_IP=ppr.tantar.ai" >> $GITHUB_ENV
          else
            echo "This branch is not configured for deployment."
            exit 1
          fi
          echo "BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> $GITHUB_ENV

      - name: Deploy to EC2
        run: |
          echo "Deploying to $SERVER_IP"
          ssh -o StrictHostKeyChecking=no ec2-user@$SERVER_IP << EOF
          export BRANCH_NAME=${{ github.ref_name }}
          cd /home/ec2-user/tantar-infra
          git checkout $BRANCH_NAME
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 365875330517.dkr.ecr.eu-west-1.amazonaws.com
          sh reload.sh $BRANCH_NAME
          EOF
