services:
  api:
    build:
      context: .
    volumes:
      - .:/app
      - api_venv:/opt/venv
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_NO_SYNC: "1"
      UV_PYTHON: python3.12
    command: ["sh", "-c", "uv run uvicorn tantar.app:app --host 0.0.0.0 --port 8000 --reload 2>&1 | tee -a /logs/api.log"]
  front:
    build:
      context: ./front
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8000"

volumes:
  api_venv:
  front_node_modules:
